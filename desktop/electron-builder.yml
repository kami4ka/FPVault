appId: com.fpvault.desktop
productName: FPVault Desktop
copyright: GPL-3.0-or-later

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

# Signs the macOS bundle ad-hoc, which is what makes a local build runnable.
afterPack: scripts/afterPack.js

# Bundled tools must live outside the asar: an executable cannot be run from
# inside an archive, and macOS cannot sign one there either.
asarUnpack:
  - resources/bin/**

extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin
    filter: ['**/*']
  # macOS reads the icon from the bundle and Windows from the exe, but a
  # Linux window has to be handed one at runtime, so it needs to be a file
  # on disk rather than something sealed inside the asar.
  - from: resources/icon.png
    to: icon.png

# All three are derived from docs/img/logo.png by scripts/make-icons.py and
# committed, so a build never needs an image toolchain.
mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # There is no Developer ID for FPVault, so builds are signed ad-hoc: the
  # bundle gets a valid local signature, which is what an arm64 Mac requires
  # to run it at all, but no identity and no notarization. Left to itself
  # electron-builder picks up whatever certificate happens to be in the
  # keychain, which is how a build ends up signed by an unrelated project.
  #
  # A downloaded ad-hoc build is quarantined and Gatekeeper will refuse it
  # until the user clears that, so a public release needs a real Developer
  # ID. When there is one, delete this line and add `notarize: true`.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
  # Every bundled executable is signed with the app's identity; without this
  # notarization rejects the bundle.
  binaries:
    - resources/bin/ffmpeg
    - resources/bin/ffprobe
    - resources/bin/sunxi-fel

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: resources/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null
